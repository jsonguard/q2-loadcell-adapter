[project]
name = "q2_loadcell_adapter"
version = "0.1.0"
description = "QIDI Q2 CS1237 load-cell adapter for Klipper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "greenlet>=2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.6",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/q2_loadcell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_functions = ["test_*"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
files = ["src/q2_loadcell"]
mypy_path = "vendor/stubs"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["reactor", "klippy"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["greenlet"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [".venv", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120
